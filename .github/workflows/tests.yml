name: Tests

on:
  push:
    branches:
      - 'test/*'
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit Tests (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3, bcmath, curl
          coverage: none

      - name: PHP Syntax Check
        run: find app routes database bootstrap config -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run Financial Integrity Regression Tests
        run: php artisan test --filter='GiftCardBackendFoundationTest|VirtualNumberRefundIntegrityTest|DaisySmsServiceTest|AiToolsIntegrationTest|AffiliateLedgerReconciliationTest|AlaricAmbiguousResponseTest|SmsBowerMiddlePricingTest'
